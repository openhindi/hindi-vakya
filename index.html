<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Hindi Vakya</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Ctext x='32' y='36' font-family='Tiro Devanagari Hindi, serif' font-size='34' font-weight='700' fill='%23ffffff' text-anchor='middle' dominant-baseline='central'%3E%E0%A4%B5%E0%A4%BE%3C/text%3E%3C/svg%3E"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <!-- SVG Icons -->
  <svg width="0" height="0" style="position:absolute; display:none" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-check" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="app-container">
    <!-- Header / Titlebar with center-aligned progress -->
    <header class="app-header">
      <div class="brand">
        <h1 class="brand-title" lang="hi">हिंदी वाक्य</h1>
      </div>

      <!-- Centered Progress Badge -->
      <div class="header-sentence-stat" title="Unique Sentences Completed">
        <span class="stat-prefix">Progress:</span>
        <strong id="titlebar-sentences-count">0</strong><span class="stat-sep">/</span>1200
      </div>

      <nav class="tab-nav">
        <button id="tab-play-btn" class="tab-btn active" type="button" aria-controls="view-play" aria-selected="true">Play</button>
        <button id="tab-stats-btn" class="tab-btn" type="button" aria-controls="view-stats" aria-selected="false">Stats</button>
      </nav>
    </header>

    <main class="app-main">
      <!-- PLAY VIEW -->
      <section id="view-play" class="view-panel active" aria-label="Game Play">
        <div class="game-card">
          <!-- Game Header / Navigation -->
          <div class="game-nav-bar">
            <div class="nav-left-group">
              <button id="btn-prev-sentence" class="btn btn-icon" type="button" aria-label="Previous sentence" title="Previous">&#x25C0;</button>
              <button id="btn-reset-sentence" class="btn btn-icon btn-sm-reset" type="button" aria-label="Reset this sentence" title="Reset sentence count">&#x21BA;</button>
            </div>
            <div class="sentence-meta">
              <span id="sentence-index-label" class="sentence-index">1 / 1200</span>
              <span id="sentence-completed-badge" class="completed-badge" title="Completion Count">0x</span>
            </div>
            <div class="game-hud-actions">
              <button id="btn-toggle-hint" class="btn btn-icon btn-hint-unicode" type="button" aria-label="Toggle Hint" title="Hint">&#x2736;</button>
              <button id="btn-next-sentence" class="btn btn-icon" type="button" aria-label="Next sentence" title="Next">&#x25B6;</button>
            </div>
          </div>

          <!-- English Reference Sentence -->
          <div class="reference-box">
            <p id="en-sentence-text" class="en-text">Loading...</p>
          </div>

          <!-- Hindi Slots (Center Aligned, no hints) -->
          <div class="slots-area">
            <div id="bridge-slots" class="bridge-slots"></div>
          </div>

          <!-- Word Chips Pool (Center Aligned, hints show here only) -->
          <div class="chips-area">
            <div id="bridge-chips" class="bridge-chips"></div>
          </div>
        </div>
      </section>

      <!-- STATS VIEW -->
      <section id="view-stats" class="view-panel" aria-label="Word Statistics" hidden>
        <div class="stats-summary-banner">
          <div class="stats-summary-left">
            <span class="stats-hero-label">Vocabulary Progress</span>
            <div class="stats-hero-val"><strong id="stats-words-count">0</strong> / 4800 completed</div>
          </div>
          <div class="stats-progress-track">
            <div id="stats-progress-bar" class="stats-progress-fill" style="width: 0%;"></div>
          </div>
        </div>

        <!-- 3-Column Words Table (Completed Words Only) -->
        <div class="words-table-container">
          <table class="words-table">
            <thead>
              <tr>
                <th class="col-no">No</th>
                <th class="col-word">Word</th>
                <th class="col-done">Done</th>
              </tr>
            </thead>
            <tbody id="words-table-body">
              <!-- Dynamically populated completed rows only -->
            </tbody>
          </table>
          <div id="table-load-more" class="table-load-more" hidden>
            <span id="table-status-text"></span>
          </div>
        </div>

        <!-- Reset Button at the bottom -->
        <div class="stats-actions-footer">
          <button id="btn-reset-stats" class="btn btn-danger" type="button">Reset</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Confirmation Dialog -->
  <dialog id="app-dialog" class="app-dialog">
    <form method="dialog" class="dialog-box">
      <h3 id="dialog-title" class="dialog-title">Confirm Reset</h3>
      <p id="dialog-message" class="dialog-message">Are you sure you want to reset all completed sentences and word progress? This cannot be undone.</p>
      <div class="dialog-actions">
        <button id="dialog-cancel-btn" class="btn btn-secondary" value="cancel" type="submit">Cancel</button>
        <button id="dialog-confirm-btn" class="btn btn-danger" value="confirm" type="submit">Reset</button>
      </div>
    </form>
  </dialog>

  <script src="app.js?v=4"></script>
</body>
</html>
